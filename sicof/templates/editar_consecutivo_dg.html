{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h3 class="mb-4">Editar Consecutivo de Gerencia</h3>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Número</label>
            <input type="text" class="form-control" value="{{ cons.numero }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Gerencia</label>
            <input type="text" name="gerencia" class="form-control" value="{{ cons.gerencia }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de documento</label>
            <input type="text" name="tipo" class="form-control" value="{{ cons.tipo }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Año</label>
            <input type="number" name="anio" class="form-control" value="{{ cons.anio }}">
        </div>

        <button class="btn btn-primary">Guardar cambios</button>
        <a href="/consecutivos_dg" class="btn btn-secondary">Cancelar</a>

    </form>
</div>

{% endblock %}
