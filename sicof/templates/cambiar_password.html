{% extends "base.html" %}
{% block content %}

<h2 style="border-left:6px solid #4b4b4b; padding-left:10px;">
    🔐 Cambiar contraseña
</h2>

<div style="
    background:white;
    padding:25px;
    border-radius:6px;
    max-width:500px;
    margin:auto;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
">

<form method="POST">

    <!-- Contraseña actual -->
    <label><strong>Contraseña actual</strong></label>
    <input type="password" name="actual" required>

    <!-- Nueva contraseña -->
    <label style="margin-top:20px;"><strong>Nueva contraseña</strong></label>
    <input type="password" name="nueva" required>

    <!-- Confirmación -->
    <label style="margin-top:20px;"><strong>Confirmar nueva contraseña</strong></label>
    <input type="password" name="confirmar" required>

    <!-- Botones -->
    <div style="margin-top:30px; display:flex; gap:15px;">
        <button type="submit" 
                style="flex:1; background:#4b4b4b; color:white; padding:10px; border:none; border-radius:4px; font-weight:bold;">
            Guardar
        </button>

        <a href="/documentos"
           style="flex:1; background:#777; color:white; padding:10px; text-align:center; border-radius:4px; text-decoration:none;">
            Cancelar
        </a>
    </div>

</form>

</div>

{% endblock %}
